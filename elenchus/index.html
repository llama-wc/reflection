<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenchus Engine | Mac Wall</title>
    <meta name="description" content="An AI Socratic tutor that challenges your reasoning and tracks the logic of the argument as you go.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Elenchus Engine | Mac Wall">
    <meta property="og:description" content="An AI Socratic tutor that challenges your reasoning and tracks the logic of the argument as you go.">
    <meta property="og:url" content="https://elenchus.mac-wall.com/elenchus/">
    <meta property="og:image" content="https://mac-wall.com/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="/crumbs.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="title-row">
                <nav class="crumbs" aria-label="Breadcrumb"><a href="https://mac-wall.com/">Home</a><a href="https://mac-wall.com/portfolio.html">Portfolio</a></nav>
                <h1>ELENCHUS ENGINE</h1>
            </div>
        </div>
        <div class="status-bar">
            <span id="loading-status">Ready. State an idea and I'll question it.</span>
            <button id="reset-btn">Start over</button>
        </div>
    </header>

    <main class="container">
        <section class="chat-section">
            <div id="chat-box">
                <div id="loading-indicator" style="display: none;">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="State an idea or ask a question…" maxlength="1000" disabled>
                <button id="send-btn" disabled>SEND</button>
            </div>
        </section>

        <section class="logic-router">
            <h2>ARGUMENT SO FAR</h2>
            
            <div class="router-card highlight-card">
                <div class="card-header">UPDATES AS YOU CONVERSE</div>
                <div id="track-updated" class="card-content monospace">Your argument will appear here.</div>
            </div>
        </section>
    </main>

    <script src="main.js?v=5"></script>
</body>
</html>
