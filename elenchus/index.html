<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenchus Engine | Mac Wall</title>
    <meta name="description" content="An AI Socratic tutor that challenges your reasoning and tracks the logic of the argument as you go.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Elenchus Engine | Mac Wall">
    <meta property="og:description" content="An AI Socratic tutor that challenges your reasoning and tracks the logic of the argument as you go.">
    <meta property="og:url" content="https://elenchus.mac-wall.com/elenchus/">
    <meta property="og:image" content="https://mac-wall.com/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>ELENCHUS ENGINE</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button id="theme-toggle" aria-label="Toggle Theme" style="background:none; border:none; color:var(--text-main); font-size:1.5rem; cursor:pointer;">◐</button>
                <a href="https://mac-wall.com/portfolio.html" class="back-btn" style="color: var(--text-main); text-decoration: none; font-weight: bold; font-family: 'Inter', sans-serif; letter-spacing: 1px;">← BACK TO PORTFOLIO</a>
            </div>
        </div>
        <div class="status-bar">
            <span id="loading-status">Ready. State an idea and I'll question it.</span>
            <button id="reset-btn">Start over</button>
        </div>
    </header>

    <main class="container">
        <section class="chat-section">
            <div id="chat-box">
                <div id="loading-indicator" style="display: none;">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="State an idea or ask a question…" maxlength="1000" disabled>
                <button id="send-btn" disabled>SEND</button>
            </div>
        </section>

        <section class="logic-router">
            <h2>ARGUMENT SO FAR</h2>
            
            <div class="router-card highlight-card" style="height: 85%; display: flex; flex-direction: column;">
                <div class="card-header">UPDATES AS YOU CONVERSE</div>
                <div id="track-updated" class="card-content monospace" style="flex: 1; overflow-y: auto; white-space: pre-wrap; line-height: 1.6;">Your argument will appear here.</div>
            </div>
        </section>
    </main>

    <script src="main.js?v=3"></script>
</body>
</html>
