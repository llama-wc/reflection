<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mac Wall</title>
    <meta name="description" content="Send Mac Wall a message.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact | Mac Wall">
    <meta property="og:description" content="Send Mac Wall a message.">
    <meta property="og:url" content="https://mac-wall.com/contact.html">
    <meta property="og:image" content="https://mac-wall.com/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <script src="/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Theme Variables (same as Portfolio) */
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --muted-color: #aaa;
            --accent-color: #FF2A2A;
            --line-color: #333;
            --card-bg: #1a1a1a;
            --on-accent: #000;
        }

        :root[data-theme="light"] {
            --bg-color: #f5f5f5;
            --text-color: #121212;
            --muted-color: #555555;
            --accent-color: #d32f2f;
            --line-color: #cccccc;
            --card-bg: #ffffff;
            --on-accent: #fff;
        }

        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 4rem 10%;
        }

        header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            border-left: 5px solid var(--accent-color);
            padding-left: 1.5rem;
        }

        #theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }

        #theme-toggle:hover {
            color: var(--accent-color);
        }

        /* The form */
        .intro {
            color: var(--muted-color);
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 2.5rem;
            max-width: 36rem;
        }

        form {
            max-width: 40rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        form[hidden] { display: none; }

        .field { display: flex; flex-direction: column; gap: 0.5rem; }
        .field.wide { grid-column: 1 / -1; }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted-color);
        }

        input, textarea {
            font: 1rem 'Inter', sans-serif;
            color: var(--text-color);
            background: var(--card-bg);
            border: 1px solid var(--line-color);
            border-radius: 0;
            padding: 0.9rem 1rem;
        }

        textarea { min-height: 11rem; resize: vertical; line-height: 1.5; }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Hidden from people; bots that fill it in are ignored */
        .trap { position: absolute; left: -9999px; }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        button[type="submit"] {
            font: 500 1.2rem 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-color);
            background: none;
            border: 1px solid var(--line-color);
            padding: 1rem 2.5rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        button[type="submit"]:hover:not(:disabled),
        button[type="submit"]:focus-visible {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--on-accent);
            outline: none;
        }

        button[type="submit"]:disabled { opacity: 0.5; cursor: default; }

        #status { margin: 0; color: var(--muted-color); }
        #status.error { color: var(--accent-color); }

        .sent {
            max-width: 36rem;
            border-left: 3px solid var(--accent-color);
            padding-left: 1.25rem;
        }
        .sent h2 { font-family: 'Oswald', sans-serif; font-size: 1.6rem; margin: 0 0 0.5rem; text-transform: uppercase; }
        .sent p { color: var(--muted-color); font-size: 1.1rem; line-height: 1.6; margin: 0; }

        @media (max-width: 768px) {
            body { padding: 2.5rem 1.5rem; }
            h1 { font-size: 3rem; }
            form { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="/crumbs.css">
</head>
<body>

    <header>
        <div class="title-row">
            <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a></nav>
            <h1>Contact</h1>
        </div>
        <button id="theme-toggle" aria-label="Toggle Theme">◐</button>
    </header>

    <main>
        <p class="intro">Questions about a project, an opportunity, or just want to say hello? Send a message and I'll reply by email.</p>

        <form id="contact-form" novalidate>
            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field wide">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <input class="trap" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="actions">
                <button type="submit">Send</button>
                <p id="status" role="status" aria-live="polite"></p>
            </div>
        </form>

        <div class="sent" id="sent" hidden>
            <h2>Message sent</h2>
            <p>Thanks for getting in touch. I'll reply to the address you gave.</p>
        </div>
    </main>

    <script>
        // Messages are delivered to Mac's inbox by Formspree (formspree.io), so no
        // address appears on the site. The form's ID comes from the Formspree dashboard.
        const FORM_ENDPOINT = 'https://formspree.io/f/YOUR_FORM_ID';

        const form = document.getElementById('contact-form');
        const status = document.getElementById('status');
        const button = form.querySelector('button[type="submit"]');

        function say(text, isError) {
            status.textContent = text;
            status.classList.toggle('error', !!isError);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const missing = [...form.querySelectorAll('[required]')].find(el => !el.value.trim() || !el.checkValidity());
            if (missing) {
                say(missing.type === 'email' && missing.value.trim() ? 'That email address doesn\'t look right.' : 'Please fill in every field.', true);
                missing.focus();
                return;
            }
            button.disabled = true;
            say('Sending...');
            try {
                const res = await fetch(FORM_ENDPOINT, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { Accept: 'application/json' },
                });
                if (!res.ok) throw new Error(res.status);
                form.hidden = true;
                document.getElementById('sent').hidden = false;
            } catch (err) {
                say('Sorry, that didn\'t send. Please try again, or reach me on LinkedIn.', true);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
