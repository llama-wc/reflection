layout: null
title: Garden
---
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac Wall</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <script>
        // If the garden can't start (a script fails to load or throws, or it still isn't
        // up after 10 s), show the page on its own instead; see gardenFallback in theme.js.
        // garden.js removes body.booting once the first page is showing.
        (function () {
            const starting = () => !document.body || document.body.classList.contains('booting');
            let gone = false;
            const fallBack = () => {
                if (gone || !starting() || !window.gardenFallback) return;
                gone = true;
                window.gardenFallback();
            };
            addEventListener('error', e => {
                if (e instanceof ErrorEvent || (e.target && e.target.tagName === 'SCRIPT')) fallBack();
            }, true);
            addEventListener('unhandledrejection', fallBack);
            setTimeout(fallBack, 10000);
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/garden/garden.css?v=28">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="booting">
    <!-- The board: every page on the site is a card, pinned in a region -->
    <div id="board" aria-hidden="true">
        <div id="world">
            <svg id="strings">
                <defs>
                    <!-- Lengths of yarn (drawn by _dev/yarn-texture.py, 180 x 14 board px) repeated along each
                         string; see drawStrings in garden.js -->
                    <pattern id="yarn-red" patternUnits="userSpaceOnUse" x="0" y="-7" width="180" height="14">
                        <image href="/garden/yarn-red.png?v=2" width="180" height="14" preserveAspectRatio="none"/>
                    </pattern>
                    <pattern id="yarn-lit" patternUnits="userSpaceOnUse" x="0" y="-7" width="180" height="14">
                        <image href="/garden/yarn-lit.png?v=2" width="180" height="14" preserveAspectRatio="none"/>
                    </pattern>
                    <pattern id="yarn-grey" patternUnits="userSpaceOnUse" x="0" y="-7" width="180" height="14">
                        <image href="/garden/yarn-grey.png?v=2" width="180" height="14" preserveAspectRatio="none"/>
                    </pattern>
                </defs>
            </svg>
        </div>
    </div>

    <!-- The page you are on, shown on top of its card -->
    <div id="page" hidden>
        <iframe id="page-frame" title="Page"></iframe>
    </div>

    <!-- The title that glides from a card into its page's heading -->
    <div id="morph" aria-hidden="true"></div>

    <!-- Controls, on every page including Home. Static pages get the same bar from theme.js. -->
    <div id="chrome">
        <div id="controls">
            <button id="board-toggle" aria-pressed="false">Board view</button>
            <!-- theme.js handles these two; they sit in the same spot as on pages shown on their own -->
            <button class="motion-toggle" type="button" aria-label="Animations" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15" cy="12" r="5"/><path class="trail" d="M2 8h5M1 12h6M2 16h5"/><path class="slash" d="M4 21 21 3"/></svg></button>
            <button id="theme-toggle" type="button" aria-label="Toggle theme">&#9680;</button>
        </div>
    </div>
    <p id="board-hint" hidden>Drag to move, scroll to zoom, click a card to open it.</p>

    <script id="garden-data" type="application/json">
    {
        "regions": {{ site.data.garden.regions | jsonify }},
        "pages": {{ site.data.garden.pages | jsonify }},
        "hubLinks": {{ site.data.garden.hub_links | jsonify }},
        "titles": {{ site.data.garden_titles | jsonify }},
        "notes": [
            {%- for post in site.posts %}
            {
                "id": {{ post.url | jsonify }},
                "title": {{ post.title | jsonify }},
                "kind": "Note",
                "url": {{ post.url | jsonify }},
                "date": "{{ post.date | date: '%Y-%m-%d' }}",
                "description": {{ post.description | jsonify }},
                "project": {{ post.project | jsonify }},
                "author": {{ post.author | jsonify }},
                "html": {{ post.content | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {%- endfor %}
        ]
    }
    </script>
    <!-- Draws pages into snapshots for their cards (MIT, garden/vendor/modern-screenshot.LICENSE) -->
    <script src="/garden/vendor/modern-screenshot.js"></script>
    <script src="/garden/garden.js?v=44"></script>
</body>
</html>
