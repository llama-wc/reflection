---
layout: null
title: Garden
---
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac Wall</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/garden/garden.css?v=8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="booting">
    <!-- The board: every page on the site is a card, pinned in a region -->
    <div id="board" aria-hidden="true">
        <div id="world">
            <svg id="strings"></svg>
        </div>
    </div>

    <!-- The page you are on, shown on top of its card -->
    <div id="page" hidden>
        <iframe id="page-frame" title="Page"></iframe>
    </div>

    <!-- On every page but Home: Back, and a directory of the whole site -->
    <nav id="page-nav" aria-label="Site" hidden>
        <button id="nav-back" type="button">&larr; Back</button>
        <button id="nav-menu" type="button" aria-expanded="false" aria-controls="nav-directory" aria-label="All pages">
            <svg viewBox="0 0 18 14" width="18" height="14" aria-hidden="true"><path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <div id="nav-directory" hidden></div>
    </nav>

    <!-- The title that glides from a card into its page's heading -->
    <div id="morph" aria-hidden="true"></div>

    <!-- Controls -->
    <div id="chrome">
        <div id="where">
            <span id="where-region"></span>
            <span id="where-title"></span>
        </div>
        <div id="controls">
            <!-- theme.js handles this button; pages shown here hide their own -->
            <button id="theme-toggle" type="button" aria-label="Toggle theme">&#9680;</button>
            <button id="board-toggle" aria-pressed="false">Board view</button>
        </div>
    </div>
    <p id="board-hint" hidden>Drag to move, scroll to zoom, click a card to open it.</p>

    <script id="garden-data" type="application/json">
    {
        "regions": {{ site.data.garden.regions | jsonify }},
        "pages": {{ site.data.garden.pages | jsonify }},
        "hubLinks": {{ site.data.garden.hub_links | jsonify }},
        "titles": {{ site.data.garden_titles | jsonify }},
        "notes": [
            {%- for post in site.posts %}
            {
                "id": {{ post.url | jsonify }},
                "title": {{ post.title | jsonify }},
                "kind": "Note",
                "url": {{ post.url | jsonify }},
                "date": "{{ post.date | date: '%Y-%m-%d' }}",
                "description": {{ post.description | jsonify }},
                "project": {{ post.project | jsonify }},
                "author": {{ post.author | jsonify }},
                "html": {{ post.content | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {%- endfor %}
        ]
    }
    </script>
    <!-- Draws pages into snapshots for their cards (MIT, garden/vendor/modern-screenshot.LICENSE) -->
    <script src="/garden/vendor/modern-screenshot.js"></script>
    <script src="/garden/garden.js?v=8"></script>
</body>
</html>
