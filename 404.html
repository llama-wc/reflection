<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Mac Wall</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        // Apply the saved theme before first paint to avoid a dark flash
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('portfolio-theme') || 'dark'); } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #FF2A2A;
            --line-color: #333;
            --p-color: #aaa;
            --nav-hover-text: #000;
        }

        :root[data-theme="light"] {
            --bg-color: #f5f5f5;
            --text-color: #121212;
            --accent-color: #d32f2f;
            --line-color: #cccccc;
            --p-color: #555555;
            --nav-hover-text: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .container {
            width: 85%;
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(4rem, 10vw, 10rem);
            text-transform: uppercase;
            margin: 0;
            line-height: 0.9;
            border-left: 10px solid var(--accent-color);
            padding-left: 2rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--p-color);
            margin: 2rem 0 0 2.5rem;
        }

        .links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 2.5rem 0 0 2.5rem;
        }

        .links a {
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--line-color);
            padding: 1rem 1.5rem;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .links a:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--nav-hover-text);
        }

        @media (max-width: 768px) {
            p, .links { margin-left: 0; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>404</h1>
        <p>That page doesn't exist. It may have moved, or the link may be mistyped.</p>
        <div class="links">
            <a href="/">Home</a>
            <a href="/portfolio.html">Portfolio</a>
        </div>
    </main>
</body>
</html>
